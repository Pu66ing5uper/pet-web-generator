<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的虚拟宠物</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="pet-name">等待加载宠物...</h1>
        <!-- 视频播放器：用于播放所有动画 -->
        <video id="pet-video" controls autoplay muted loop playsinline>
            你的浏览器不支持视频播放。
        </video>
        <!-- 互动按钮区域 -->
        <div id="interaction-buttons" class="buttons">
            <p>点击按钮与它互动：</p>
            <!-- 按钮将由 script.js 动态生成 -->
        </div>
        <p class="hint" id="status-hint">宠物正在待机，可以互动。</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
